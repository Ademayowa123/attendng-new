<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Class Subjects</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header">
                <div>
                    <h1 id="pageTitle">Subjects</h1>
                    <p id="sessionLabel"></p>
                </div>
                <a href="/school/admin/classes.html"
                   class="btn btn-back btn-sm"
                   style="text-decoration:none; border-radius: 10px;">
                    <i class="fa-solid fa-arrow-left"></i> Back to Classes
                </a>
            </header>

            <section class="card">

                <div class="table-toolbar">
                    <button type="button" class="btn-primary" id="openAddClassSubject">
                        <i class="fa-solid fa-plus"></i> Add subject to this class
                    </button>
                </div>

                <div class="table-scroll">
                    <table class="class-subjects-table" style="width:100%; border-collapse:collapse; font-size:14px;">
                        <thead>
                            <tr style="text-align:left; font-size:12px; color:var(--text-muted); border-bottom:1px solid var(--border);">
                                <th class="sticky-col1" style="padding:10px 8px; min-width:160px;">Subject</th>
                                <th style="padding:10px 8px; min-width:200px;">Teacher</th>
                                <th style="padding:10px 8px;"></th>
                            </tr>
                        </thead>
                        <tbody id="classSubjectsTableBody">
                            <!-- populated at runtime -->
                        </tbody>
                    </table>
                </div>

                <p id="noClassSubjectsNotice" style="display:none; color:var(--text-muted); margin:12px 0 4px;">
                    No subjects assigned to this class yet.
                </p>

            </section>

        </main>

    </div>

    <!-- ADD SUBJECT TO CLASS MODAL -->
    <div class="confirm-modal" id="addClassSubjectModal">
        <div class="confirm-card" style="width:360px;">

            <div class="confirm-header">
                <h2>Add a subject to this class</h2>
            </div>

            <div class="confirm-body">

                <label for="addClassSubjectSelect" style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">Subject</label>
                <select id="addClassSubjectSelect"
                        style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; box-sizing:border-box; margin-bottom:14px;">
                </select>

                <label for="addClassSubjectTeacher" style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">Teacher</label>
                <select id="addClassSubjectTeacher"
                        style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; box-sizing:border-box;">
                    <option value="">Not assigned yet</option>
                </select>

                <p class="login-error" id="addClassSubjectError" style="display:none; margin-top:8px;"></p>

                <p id="noMoreSubjectsNotice" style="display:none; color:var(--text-muted); margin-top:8px;">
                    Every subject in your school's subject list is already assigned to this class.
                    <a href="/school/admin/subjects.html">Add more subjects</a> first.
                </p>

            </div>

            <div class="confirm-footer">
                <button type="button" class="btn-info" id="cancelAddClassSubject">Cancel</button>
                <button type="button" class="btn-primary" id="submitAddClassSubject">Add subject</button>
            </div>

        </div>
    </div>

    <!-- REMOVE SUBJECT FROM CLASS CONFIRM MODAL -->
    <div class="confirm-modal" id="removeClassSubjectModal">
        <div class="confirm-card" style="width:340px;">

            <div class="confirm-header">
                <h2>Remove subject from class</h2>
            </div>

            <div class="confirm-body">

                <p id="removeClassSubjectMessage" style="margin:0;"></p>

                <p class="login-error" id="removeClassSubjectError" style="display:none; margin-top:8px;"></p>

            </div>

            <div class="confirm-footer">
                <button type="button" class="btn-info" id="cancelRemoveClassSubject">Cancel</button>
                <button type="button" class="btn-danger" id="confirmRemoveClassSubject">Remove</button>
            </div>

        </div>
    </div>

    <!-- REMOVE BLOCKED INFO MODAL -->
    <div class="confirm-modal" id="removeBlockedModal">
        <div class="confirm-card" style="width:340px;">

            <div class="confirm-header">
                <h2>Can't remove this subject</h2>
            </div>

            <div class="confirm-body">
                <p id="removeBlockedMessage" style="margin:0;"></p>
            </div>

            <div class="confirm-footer">
                <button type="button" class="btn-primary" id="closeRemoveBlockedModal">OK</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/activity-log.js"></script>
    <script src="/assets/js/admin-class-subjects.js"></script>

</body>
</html>

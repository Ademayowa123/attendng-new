<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Students</title>
    <link rel="icon" href="/assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>
<body>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header st-header">

                <div class="st-title-row">
                    <span class="rs-tile" id="classTile"></span>
                    <div>
                        <h1>Students</h1>
                        <p><span id="className"></span> · <span id="schoolName"></span></p>
                    </div>
                </div>

                <span class="st-pill st-pill-view"><i class="fa-solid fa-eye" aria-hidden="true"></i> View only</span>

            </header>

            <section class="st-metrics">

                <div class="st-metric">
                    <span class="st-metric-label">Students</span>
                    <strong id="studentCount">0</strong>
                </div>

                <div class="st-metric">
                    <span class="st-metric-label">Gender</span>
                    <div class="st-split">
                        <span><i class="st-dot st-dot-male"></i>Male <b id="maleCount">0</b></span>
                        <span><i class="st-dot st-dot-female"></i>Female <b id="femaleCount">0</b></span>
                    </div>
                    <div class="st-bar" id="genderBar"></div>
                </div>

                <div class="st-metric">
                    <span class="st-metric-label">Admission numbers</span>
                    <strong id="admissionCount">0</strong>
                    <span class="st-metric-note" id="admissionNote">recorded</span>
                </div>

            </section>

            <section class="st-toolbar">

                <label class="rs-search">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input type="search" id="searchStudent" placeholder="Search students" autocomplete="off" aria-label="Search students">
                </label>

                <div class="rs-filters" role="group" aria-label="Filter by gender">
                    <button type="button" class="rs-filter is-active" data-gender="all" aria-pressed="true">All <span id="countAll">0</span></button>
                    <button type="button" class="rs-filter" data-gender="male" aria-pressed="false">Male <span id="countMale">0</span></button>
                    <button type="button" class="rs-filter" data-gender="female" aria-pressed="false">Female <span id="countFemale">0</span></button>
                </div>

            </section>

            <section class="rs-list">

                <div class="st-list-head st-cols st-cols-ro" aria-hidden="true">
                    <span>#</span>
                    <span>Student</span>
                    <span>Admission no.</span>
                    <span>Gender</span>
                    <span></span>
                </div>

                <div id="studentList"></div>

                <p class="rs-note" id="listNote" hidden></p>

                <div class="rs-list-foot">
                    <span id="showingCount"></span>
                </div>

            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/students.js"></script>

</body>
</html>

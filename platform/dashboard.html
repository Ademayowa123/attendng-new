<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Platform Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <script>if (location.pathname.indexOf("/platform/") === 0) document.documentElement.classList.add("platform-ui");</script>

</head>
<body>

    <div class="container">

        <aside class="sidebar" id="sidebarMount">
            <!-- injected by auth.js based on tier -->
        </aside>

        <main class="main-content">

            <header class="top-header" style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
                <div>
                    <h1><span id="greeting"></span> <span id="fullName"></span></h1>
                    <p>Platform overview</p>
                </div>
                <a href="/platform/schools.html#onboard" class="btn-primary" style="text-decoration:none; display:inline-block;">
                    <i class="fa-solid fa-plus"></i> Onboard school
                </a>
            </header>

            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-card-icon"><i class="fa-solid fa-building-columns"></i></div>
                    <div class="summary-card-body">
                        <h3>Schools</h3>
                        <p id="dashSchools">-</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-icon"><i class="fa-solid fa-users"></i></div>
                    <div class="summary-card-body">
                        <h3>Members</h3>
                        <p id="dashMembers">-</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-icon"><i class="fa-solid fa-calendar-plus"></i></div>
                    <div class="summary-card-body">
                        <h3>Added this month</h3>
                        <p id="dashMonth">-</p>
                    </div>
                </div>
            </div>

            <div class="card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem;">
                    <h3 style="margin:0; font-size:15px;">Recently onboarded</h3>
                    <a href="/platform/schools.html" style="font-size:13px; color:var(--primary); text-decoration:none;">View all schools</a>
                </div>
                <div id="recentSchools" class="school-grid list"></div>
                <p id="recentEmpty" style="display:none; margin:0; color:var(--text-muted); font-size:14px;">No schools yet. Onboard your first one to see it here.</p>
            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/platform-dashboard.js"></script>

</body>
</html>

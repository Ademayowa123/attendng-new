<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Term Report</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>
        /* Print-only layout: hide the on-screen summary cards and
           top header, show the school header (with logo) instead —
           `!important` here overrides both the inline display:none
           on #printHeader and any rules from the shared stylesheet. */

        @media print {

            .sidebar,
            .top-header,
            .summary-grid {
                display: none !important;
            }

            #printHeader {
                display: flex !important;
                align-items: center;
                gap: 14px;
            }

            #printHeader.has-logo #printLogo {
                display: block !important;
            }

            /* Chrome strips background colors on print/PDF by
               default (regardless of the "Background graphics"
               checkbox reflecting this) unless explicitly told
               to keep them — this is what makes the teal table
               header (and the teal print header) actually show up
               in the printed/PDF output instead of turning white. */

            * {
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }

        }
    </style>

</head>
<body>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header">
                <div>
                    <h1>Term Report</h1>
                    <p><span id="className"></span></p>
                </div>
                <div class="report-controls">
                    <select id="reportTerm" class="report-week-select">
                        <option value="1st Term">1st Term</option>
                        <option value="2nd Term">2nd Term</option>
                        <option value="3rd Term">3rd Term</option>
                    </select>
                    <div class="report-actions">
                        <button type="button" class="btn-info btn-sm" id="switchToWeeklyBtn"><i class="fa-solid fa-arrow-right-arrow-left"></i> Weekly Report</button>
                        <button type="button" class="btn-info btn-sm" id="printBtn"><i class="fa-solid fa-print"></i> Print</button>
                        <button type="button" class="btn-success btn-sm" id="exportBtn"><i class="fa-solid fa-file-excel"></i> Export</button>
                    </div>
                </div>
            </header>

            <div id="noStartDateNotice" class="card" style="display:none;">
                <p style="margin:0;">Your admin hasn't set this session's start date yet — ask them to set it on the Sessions page.</p>
            </div>

            <div id="reportWrapper" style="display:none;">

                <div class="summary-grid">
                    <div class="summary-card"><div class="summary-card-icon"><i class="fa-solid fa-user-check"></i></div><div><h3>Total Attendance</h3><p id="cardTotalPresent">0</p></div></div>
                    <div class="summary-card"><div class="summary-card-icon"><i class="fa-solid fa-calendar-days"></i></div><div><h3>School Opened</h3><p id="cardSchoolOpened">0</p></div></div>
                    <div class="summary-card"><div class="summary-card-icon"><i class="fa-solid fa-chart-column"></i></div><div><h3>Average Attendance</h3><p id="cardAverage">0%</p></div></div>
                    <div class="summary-card"><div class="summary-card-icon"><i class="fa-solid fa-person"></i></div><div><h3>Male Attendance</h3><p id="cardMale">0%</p></div></div>
                    <div class="summary-card"><div class="summary-card-icon"><i class="fa-solid fa-person-dress"></i></div><div><h3>Female Attendance</h3><p id="cardFemale">0%</p></div></div>
                    <div class="summary-card"><div class="summary-card-icon"><i class="fa-solid fa-percent"></i></div><div><h3>Attendance %</h3><p id="cardOverall">0%</p></div></div>
                </div>

                <div id="printHeader" style="display:none; margin-bottom:1rem;">
                    <img id="printLogo" alt="School logo" style="display:none; height:56px; width:56px; object-fit:contain; flex-shrink:0;">
                    <div>
                        <h2 id="printTitle" style="margin:0 0 4px;"></h2>
                        <p id="printMeta" style="margin:0; font-size:13px; color:var(--text-secondary);"></p>
                    </div>
                </div>

                <div class="card">

                    <div class="table-scroll">
                    <table class="report-table" style="width:100%; border-collapse:collapse; font-size:14px;">
                        <thead>
                            <tr>
                                <th class="sticky-col1" style="padding:10px 8px; width:56px; background:#0F766E; color:#FFFFFF; font-weight:600;">S/N</th>
                                <th class="sticky-col2" style="padding:10px 8px; left:56px; min-width:160px; background:#0F766E; color:#FFFFFF; font-weight:600;">Student Name</th>
                                <th style="padding:10px 8px; min-width:90px; text-align:center; background:#0F766E; color:#FFFFFF; font-weight:600;">Attendance</th>
                                <th style="padding:10px 8px; min-width:110px; text-align:center; background:#0F766E; color:#FFFFFF; font-weight:600;">Attendance %</th>
                                <th style="padding:10px 8px; min-width:90px; text-align:center; background:#0F766E; color:#FFFFFF; font-weight:600;">Status</th>
                            </tr>
                        </thead>
                        <tbody id="reportTableBody"></tbody>
                    </table>
                    </div>

                </div>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <script src="/assets/js/report-term.js"></script>

</body>
</html>

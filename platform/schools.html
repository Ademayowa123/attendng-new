<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Schools</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>
<body>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header">
                <div>
                    <h1>Schools</h1>
                    <p id="schoolCountLabel"></p>
                </div>
            </header>

            <section class="student-actions">
                <input type="text" id="searchSchool" placeholder="Search schools...">
            </section>

            <div class="card">

                <!-- Desktop / tablet: table. Hidden on phones (<= 768px). -->
                <div class="table-scroll teacher-table-scroll">
                    <table style="width:100%; border-collapse:collapse; font-size:14px;">
                        <thead>
                            <tr style="text-align:left; font-size:12px; color:var(--text-muted); border-bottom:1px solid var(--border);">
                                <th style="padding:8px 4px;">School</th>
                                <th style="padding:8px 4px;">Genesis username</th>
                                <th style="padding:8px 4px;">Members</th>
                                <th style="padding:8px 4px;"></th>
                            </tr>
                        </thead>
                        <tbody id="schoolsTableBody"></tbody>
                    </table>
                </div>

                <!-- Phones: stacked cards, so nothing scrolls sideways. -->
                <div class="teacher-cards" id="schoolCardsMount"></div>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/platform-schools.js"></script>

</body>
</html>

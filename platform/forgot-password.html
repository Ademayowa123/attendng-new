<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Forgot Password</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>
<body class="login-body">

    <div class="login-page">

        <div class="login-card">

            <div class="login-brand">
                <img src="/assets/images/logo.png" alt="AttendNG" class="login-logo">
                <p>Superadmin password recovery</p>
            </div>

            <form id="requestLinkForm">

                <label for="email">Email</label>
                <input type="email" id="email" autocomplete="email" required>

                <p class="login-error" id="requestError" style="display:none;"></p>

                <button type="submit" id="requestSubmit">Send reset link</button>

            </form>

            <div id="linkSentNotice" style="display:none; text-align:center; font-size:13px; color:var(--text-secondary);">
                <p>If that email belongs to a superadmin account, a reset link has been sent.</p>
                <p>Check your inbox and click the link to set a new password.</p>
            </div>

            <p class="login-hint"><a href="/login.html">Back to login</a></p>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/forgot-password.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Results</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>
<body>

    <div id="toast" class="toast"></div>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header">
                <div>
                    <h1>Results</h1>
                    <p id="termLabel"></p>
                </div>
            </header>

            <section class="card" style="margin-bottom:16px;">

                <label for="assignmentSelect" style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">
                    Class &amp; subject
                </label>
                <select id="assignmentSelect"
                        style="width:100%; max-width:420px; padding:8px 10px; border:1px solid var(--border); border-radius:8px; box-sizing:border-box;">
                </select>

            </section>

            <div id="noAssignmentsNotice" class="card" style="display:none;">
                <p style="margin:0;">You haven't been assigned to teach any subject yet. Ask your admin to assign you under Classes → Subjects.</p>
            </div>

            <section class="card" id="scoresCard" style="display:none;">

                <div class="table-toolbar">
                    <div>CA out of 40, Exam out of 60 — total is calculated for you.</div>
                </div>

                <div class="table-scroll">
                    <table class="scores-table" style="width:100%; border-collapse:collapse; font-size:14px;">
                        <thead>
                            <tr style="text-align:left; font-size:12px; color:var(--text-muted); border-bottom:1px solid var(--border);">
                                <th class="sticky-col1" style="padding:10px 8px; min-width:180px;">Student</th>
                                <th style="padding:10px 8px; width:100px;">CA (/40)</th>
                                <th style="padding:10px 8px; width:100px;">Exam (/60)</th>
                                <th style="padding:10px 8px; width:90px;">Total</th>
                                <th style="padding:10px 8px; width:80px;">Grade</th>
                            </tr>
                        </thead>
                        <tbody id="scoresTableBody">
                            <!-- populated at runtime -->
                        </tbody>
                    </table>
                </div>

                <p id="noStudentsNotice" style="display:none; color:var(--text-muted); margin:12px 0 4px;">
                    No students in this class yet.
                </p>

            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/activity-log.js"></script>
    <script src="/assets/js/grading.js"></script>
    <script src="/assets/js/results.js"></script>

</body>
</html>

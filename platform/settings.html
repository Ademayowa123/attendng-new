<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Settings</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>
<body>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header">
                <div><h1>Settings</h1></div>
            </header>

            <div class="card" style="max-width:460px; margin-bottom:1.25rem;">

                <h3 style="margin-top:0;">Your details</h3>

                <form id="nameForm">

                    <div class="form-group">
                        <label>Full name</label>
                        <input type="text" id="fullNameInput" required>
                    </div>

                    <div class="form-group">
                        <label>Email</label>
                        <input type="email" id="emailDisplay" disabled>
                        <p style="font-size:12px; color:var(--text-muted); margin:4px 0 0;">Email can't be changed here.</p>
                    </div>

                    <p class="login-error" id="nameError" style="display:none;"></p>

                    <button type="submit" class="btn-primary">Save</button>

                </form>

            </div>

            <div class="card" style="max-width:460px;">

                <h3 style="margin-top:0;">Change password</h3>

                <form id="passwordForm">

                    <div class="form-group">
                        <label>Current password</label>
                        <div class="password-field">
                            <input type="password" id="currentPassword" required>
                            <button type="button" class="password-toggle" data-target="currentPassword" tabindex="-1"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>New password</label>
                        <div class="password-field">
                            <input type="password" id="newPassword" required minlength="6">
                            <button type="button" class="password-toggle" data-target="newPassword" tabindex="-1"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Confirm new password</label>
                        <div class="password-field">
                            <input type="password" id="confirmPassword" required minlength="6">
                            <button type="button" class="password-toggle" data-target="confirmPassword" tabindex="-1"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>

                    <p class="login-error" id="passwordError" style="display:none;"></p>
                    <p style="color:#0f766e; font-size:13px; display:none;" id="passwordSuccess">Password updated.</p>

                    <button type="submit" class="btn-primary">Update password</button>

                </form>

            </div>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/platform-settings.js"></script>

</body>
</html>

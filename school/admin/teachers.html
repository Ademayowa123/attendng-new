<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Teachers</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>

<div id="toast" class="toast"></div>

<body class="page-teachers">

    <div id="toast" class="toast"></div>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header">
                <div>
                    <h1>Teachers</h1>
                    <p><span id="schoolName"></span></p>
                </div>
                <button type="button" class="btn-primary" id="openAddTeacher">
                    <i class="fa-solid fa-plus"></i> Add teacher
                </button>
            </header>

            <div class="card">

                <div class="table-scroll teacher-table-scroll">
                <table class="teacher-table" style="width:100%; border-collapse:collapse; font-size:14px;">
                    <thead>
                        <tr style="text-align:left; font-size:12px; color:var(--text-muted); border-bottom:1px solid var(--border);">
                            <th class="sticky-col1" style="padding:8px 4px;">Name</th>
                            <th class="sticky-col2" style="padding:8px 4px;">Username</th>
                            <th style="padding:8px 4px;">Role</th>
                            <th class="desktop-actions-cell" style="padding:8px 4px;"></th>
                        </tr>
                    </thead>
                    <tbody id="membersTableBody">
                        <!-- populated at runtime -->
                    </tbody>
                </table>
                </div>

                <div class="teacher-cards" id="teacherCardsMount">
                    <!-- mobile-only card layout, populated at runtime -->
                </div>

            </div>

        </main>

    </div>

    <!-- ADD TEACHER MODAL -->
    <div class="confirm-modal" id="addTeacherModal">
        <div class="confirm-card" style="width:360px;">

            <div id="addTeacherForm">

                <div class="confirm-header">
                    <h2>Add a teacher</h2>
                </div>

                <div class="confirm-body">

                    <label for="teacherFullName" style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">Full name</label>
                    <input type="text" id="teacherFullName" placeholder="Chibuzor Okafor" required
                           style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; box-sizing:border-box;">

                    <p class="login-error" id="addTeacherError" style="display:none; margin-top:8px;"></p>

                </div>

                <div class="confirm-footer">
                    <button type="button" class="btn-secondary" id="cancelAddTeacher">Cancel</button>
                    <button type="button" class="btn-primary" id="submitAddTeacher">Add teacher</button>
                </div>

            </div>

            <div id="addTeacherResult" style="display:none;">

                <div class="confirm-header">
                    <h2>Teacher created</h2>
                </div>

                <div class="confirm-body">
                    <p id="addTeacherResultText"></p>

                    <div style="background:var(--surface-alt); border-radius:8px; padding:0.75rem 1rem; margin:0.75rem 0; display:flex; flex-direction:column; gap:8px;">
                        <div>
                            <span style="display:block; font-size:11px; color:var(--text-muted);">Username</span>
                            <code id="newTeacherUsername"></code>
                        </div>
                        <div>
                            <span style="display:block; font-size:11px; color:var(--text-muted);">Temporary password</span>
                            <code id="newTeacherPassword"></code>
                        </div>
                    </div>
                </div>

                <div class="confirm-footer">
                    <button type="button" class="btn-primary" id="closeAddTeacherResult">Done</button>
                </div>

            </div>

        </div>
    </div>

    <!-- RESET PASSWORD MODAL -->
    <div class="confirm-modal" id="resetPasswordModal">
        <div class="confirm-card" style="width:340px;">

            <div class="confirm-header">
                <h2>Password reset</h2>
            </div>

            <div class="confirm-body">
                <p id="resetPasswordText"></p>

                <div style="background:var(--surface-alt); border-radius:8px; padding:0.75rem 1rem; margin:0.75rem 0; display:flex; flex-direction:column; gap:8px;">
                    <div>
                        <span style="display:block; font-size:11px; color:var(--text-muted);">Username</span>
                        <code id="resetUsername"></code>
                    </div>
                    <div>
                        <span style="display:block; font-size:11px; color:var(--text-muted);">New temporary password</span>
                        <code id="resetPassword"></code>
                    </div>
                </div>
            </div>

            <div class="confirm-footer">
                <button type="button" class="btn-primary" id="closeResetPasswordModal">Done</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/activity-log.js"></script>
    <script src="/assets/js/admin-teachers.js"></script>

</body>
</html>

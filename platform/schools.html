<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Schools</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <script>if (location.pathname.indexOf("/platform/") === 0) document.documentElement.classList.add("platform-ui");</script>

</head>
<body>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header" style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; flex-wrap:wrap;">
                <div>
                    <h1>Schools</h1>
                    <p id="schoolCountLabel">Every school on the platform</p>
                </div>
                <button type="button" class="btn-primary" id="openOnboard">
                    <i class="fa-solid fa-plus"></i> Onboard school
                </button>
            </header>

            <div class="summary-grid">
                <div class="summary-card">
                    <div class="summary-card-icon"><i class="fa-solid fa-building-columns"></i></div>
                    <div class="summary-card-body">
                        <h3>Schools</h3>
                        <p id="metricSchools">-</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-icon"><i class="fa-solid fa-users"></i></div>
                    <div class="summary-card-body">
                        <h3>Members</h3>
                        <p id="metricMembers">-</p>
                    </div>
                </div>
                <div class="summary-card">
                    <div class="summary-card-icon"><i class="fa-solid fa-calendar-plus"></i></div>
                    <div class="summary-card-body">
                        <h3>Added this month</h3>
                        <p id="metricMonth">-</p>
                    </div>
                </div>
            </div>

            <div class="school-toolbar">
                <div class="school-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchSchool" placeholder="Search by school or username" autocomplete="off" aria-label="Search schools">
                </div>
                <select id="sortSchool" class="school-sort" aria-label="Sort schools">
                    <option value="newest">Newest first</option>
                    <option value="name">Name (A to Z)</option>
                    <option value="members">Most members</option>
                </select>
                <div class="view-toggle">
                    <button type="button" id="viewGrid" aria-label="Grid view"><i class="fa-solid fa-table-cells-large"></i></button>
                    <button type="button" id="viewList" aria-label="List view"><i class="fa-solid fa-list"></i></button>
                </div>
            </div>

            <div id="schoolGrid" class="school-grid"></div>

            <div id="schoolEmpty" class="school-empty" style="display:none;">
                <h3 id="schoolEmptyTitle"></h3>
                <p id="schoolEmptyText"></p>
                <button type="button" class="btn-primary" id="emptyOnboard" style="display:none;">Onboard school</button>
            </div>

        </main>

    </div>

    <div class="modal" id="onboardModal" role="dialog" aria-modal="true" aria-labelledby="onboardTitle">
        <div class="modal-content" style="width:440px;">

            <div class="modal-header">
                <h2 id="onboardTitle">Onboard a school</h2>
                <button type="button" id="closeOnboard" aria-label="Close">&times;</button>
            </div>

            <form id="onboardForm">

                <div class="form-group">
                    <label for="schoolName">School name</label>
                    <input type="text" id="schoolName" placeholder="Honeyland College, Ipaja" required>
                </div>

                <p class="login-error" id="onboardError" style="display:none;"></p>

                <div class="modal-buttons">
                    <button type="button" class="btn-light" id="cancelOnboard">Cancel</button>
                    <button type="submit" class="btn-primary" id="onboardSubmit">Onboard school</button>
                </div>

            </form>

            <div id="onboardResult" style="display:none;">

                <p id="onboardResultText" style="margin:0 0 1rem; font-size:14px; color:var(--text-secondary);"></p>

                <div class="credential-box">
                    <div class="credential-row">
                        <div>
                            <span class="credential-label">Username</span>
                            <code id="resultUsername"></code>
                        </div>
                        <button type="button" class="credential-copy" data-copy="resultUsername">Copy</button>
                    </div>
                    <div class="credential-row">
                        <div>
                            <span class="credential-label">Temporary password</span>
                            <code id="resultPassword"></code>
                        </div>
                        <button type="button" class="credential-copy" data-copy="resultPassword">Copy</button>
                    </div>
                </div>

                <div class="modal-buttons">
                    <button type="button" class="btn-light" id="onboardAnother">Onboard another</button>
                    <button type="button" class="btn-primary" id="onboardDone">Done</button>
                </div>

            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/platform-schools.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | School Settings</title>
    <link rel="icon" href="/assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>
<body>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header">
                <div>
                    <h1>School Settings</h1>
                    <p>How your school appears across AttendNG and on report cards</p>
                </div>
            </header>

            <form id="settingsForm" novalidate>

                <div class="card sset-profile">

                    <div class="sset-logo">
                        <div class="sset-logo-box" id="logoBox">
                            <span id="logoInitials"></span>
                            <img id="logoPreview" alt="" hidden>
                        </div>
                        <input type="file" id="logoFile" accept="image/*" hidden>
                        <button type="button" class="sset-cam" id="chooseLogoBtn" aria-label="Change logo">
                            <i class="fa-solid fa-camera"></i>
                        </button>
                    </div>

                    <div class="sset-profile-main">
                        <div class="form-group" style="margin-bottom:0;">
                            <label for="schoolNameInput">School name</label>
                            <input type="text" id="schoolNameInput" required>
                        </div>
                        <p class="sset-hint">Logo: PNG or JPG, square works best. It saves as soon as you pick it.</p>
                        <p class="login-error" id="logoError" style="display:none;"></p>
                    </div>

                </div>

                <div class="sset-grid">

                    <div class="card">

                        <h3 class="sset-title">Contact details</h3>
                        <p class="sset-sub">Printed at the top of every report card.</p>

                        <div class="form-group">
                            <label for="schoolAddressInput">Address</label>
                            <textarea id="schoolAddressInput" rows="2"></textarea>
                        </div>

                        <div class="form-group" style="margin-bottom:0;">
                            <label for="schoolPhoneInput">Phone number</label>
                            <input type="text" id="schoolPhoneInput">
                        </div>

                    </div>

                    <div class="card">

                        <h3 class="sset-title">Report card preview</h3>
                        <p class="sset-sub">Updates as you type.</p>

                        <div class="sset-prev">
                            <div class="sset-prev-logo" id="previewLogo"></div>
                            <p class="sset-prev-name" id="previewName"></p>
                            <p class="sset-prev-line" id="previewAddress"></p>
                            <p class="sset-prev-line" id="previewPhone"></p>
                            <div class="sset-prev-rule"></div>
                            <p class="sset-prev-title">Report card</p>
                        </div>

                    </div>

                </div>

                <p class="login-error" id="saveError" style="display:none; margin-top:12px;"></p>

                <div class="sset-bar" id="saveBar" hidden>
                    <span><i class="fa-solid fa-circle-exclamation"></i> You have unsaved changes</span>
                    <span class="sset-bar-actions">
                        <button type="button" class="btn-secondary" id="discardBtn">Discard</button>
                        <button type="submit" class="btn-primary" id="saveBtn">Save changes</button>
                    </span>
                </div>

            </form>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/admin-settings.js"></script>

</body>
</html>

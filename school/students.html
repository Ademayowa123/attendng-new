<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Students</title>
    <link rel="icon" href="/assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>
<body>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header">
                <div>
                    <h1>Students</h1>
                    <p><span id="className"></span> · <span id="schoolName"></span></p>
                </div>
            </header>

            <section class="student-actions">
                <input type="text" id="searchStudent" placeholder="Search student...">
            </section>

            <section class="card has-mobile-cards">

                <div class="table-toolbar">
                    <div>Total Students: <strong id="studentCount">0</strong></div>
                </div>

                <div class="table-scroll desktop-only-table">
                <table style="width:100%; border-collapse:collapse; font-size:14px;">
                    <thead>
                        <tr style="text-align:left; font-size:12px; color:var(--text-secondary); border-bottom:2px solid var(--border);">
                            <th style="padding:10px 8px; width:56px;">S/N</th>
                            <th style="padding:10px 8px;">Surname</th>
                            <th style="padding:10px 8px;">First Name</th>
                            <th style="padding:10px 8px;">Other Name</th>
                            <th style="padding:10px 8px; width:90px;">Gender</th>
                        </tr>
                    </thead>
                    <tbody id="studentTable"></tbody>
                </table>
                </div>

                <div class="mobile-card-list" id="studentCardList"></div>

            </section>

        </main>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/students.js"></script>

</body>
</html>

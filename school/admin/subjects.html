<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Subjects</title>
    <link rel="icon" href="/assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>
<body class="page-teachers page-subjects">

    <div id="toast" class="toast"></div>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header">
                <div>
                    <h1>Subjects</h1>
                    <p>Master subject list for the school &middot; <strong id="subjectCount">0 subjects</strong></p>
                </div>
                <button type="button" class="btn-primary" id="openAddSubject">
                    <i class="fa-solid fa-plus"></i> Add subject
                </button>
            </header>

            <!-- SUMMARY TILES -->
            <section class="tm-stats" aria-label="Subject summary">
                <div class="tm-stat">
                    <span class="tm-stat-icon tm-tone-teal"><i class="fa-solid fa-book-open"></i></span>
                    <div><strong id="sjStatTotal">0</strong><span>Subjects</span></div>
                </div>
                <div class="tm-stat">
                    <span class="tm-stat-icon tm-tone-indigo"><i class="fa-solid fa-circle-check"></i></span>
                    <div><strong id="sjStatUsed">0</strong><span>In use</span></div>
                </div>
                <div class="tm-stat">
                    <span class="tm-stat-icon tm-tone-amber"><i class="fa-solid fa-triangle-exclamation"></i></span>
                    <div><strong id="sjStatUnused">0</strong><span>Not used yet</span></div>
                </div>
                <div class="tm-stat">
                    <span class="tm-stat-icon tm-tone-green"><i class="fa-solid fa-layer-group"></i></span>
                    <div><strong id="sjStatAssignments">0</strong><span>Class assignments</span></div>
                </div>
            </section>

            <!-- SEARCH + FILTER -->
            <div class="tm-toolbar">
                <label class="tm-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="subjectSearch" placeholder="Search subjects" autocomplete="off">
                </label>
                <div class="tm-filters" role="group" aria-label="Filter by usage">
                    <button type="button" class="tm-chip is-active" data-filter="all">All</button>
                    <button type="button" class="tm-chip" data-filter="used">In use</button>
                    <button type="button" class="tm-chip" data-filter="unused">Not used</button>
                </div>
            </div>

            <!-- SUBJECT CARDS (populated at runtime) -->
            <div class="tm-grid sj-grid" id="subjectGridMount"></div>

            <div class="tm-empty" id="noSubjectsNotice" style="display:none;">
                <i class="fa-regular fa-face-frown-open"></i>
                <p id="subjectEmptyText">No subjects yet.</p>
            </div>

        </main>

    </div>

    <!-- ADD SUBJECT MODAL -->
    <div class="confirm-modal" id="addSubjectModal">
        <div class="confirm-card" style="width:340px;">

            <div class="confirm-header">
                <h2>Add a subject</h2>
            </div>

            <div class="confirm-body">

                <label for="newSubjectName" style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">Subject name</label>
                <input type="text" id="newSubjectName" placeholder="Mathematics" required
                       style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; box-sizing:border-box;">

                <p class="login-error" id="addSubjectError" style="display:none; margin-top:8px;"></p>

            </div>

            <div class="confirm-footer">
                <button type="button" class="btn-secondary" id="cancelAddSubject">Cancel</button>
                <button type="button" class="btn-primary" id="submitAddSubject">Add subject</button>
            </div>

        </div>
    </div>

    <!-- EDIT SUBJECT MODAL -->
    <div class="confirm-modal" id="editSubjectModal">
        <div class="confirm-card" style="width:340px;">

            <div class="confirm-header">
                <h2>Edit subject name</h2>
            </div>

            <div class="confirm-body">

                <label for="editSubjectName" style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">Subject name</label>
                <input type="text" id="editSubjectName" placeholder="Mathematics" required
                       style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; box-sizing:border-box;">

                <p class="login-error" id="editSubjectError" style="display:none; margin-top:8px;"></p>

            </div>

            <div class="confirm-footer">
                <button type="button" class="btn-secondary" id="cancelEditSubject">Cancel</button>
                <button type="button" class="btn-primary" id="submitEditSubject">Save changes</button>
            </div>

        </div>
    </div>

    <!-- DELETE SUBJECT CONFIRM MODAL -->
    <div class="confirm-modal" id="deleteSubjectModal">
        <div class="confirm-card" style="width:340px;">

            <div class="confirm-header">
                <h2>Delete subject</h2>
            </div>

            <div class="confirm-body">

                <p id="deleteSubjectMessage" style="margin:0;"></p>

                <p class="login-error" id="deleteSubjectError" style="display:none; margin-top:8px;"></p>

            </div>

            <div class="confirm-footer">
                <button type="button" class="btn-secondary" id="cancelDeleteSubject">Cancel</button>
                <button type="button" class="btn-danger" id="confirmDeleteSubject">Delete</button>
            </div>

        </div>
    </div>

    <!-- DELETE BLOCKED INFO MODAL -->
    <div class="confirm-modal" id="deleteBlockedModal">
        <div class="confirm-card" style="width:340px;">

            <div class="confirm-header">
                <h2>Can't delete this subject</h2>
            </div>

            <div class="confirm-body">
                <p id="deleteBlockedMessage" style="margin:0;"></p>
            </div>

            <div class="confirm-footer">
                <button type="button" class="btn-primary" id="closeDeleteBlockedModal">OK</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/activity-log.js"></script>
    <script src="/assets/js/admin-subjects.js"></script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Teachers</title>
    <link rel="icon" href="/assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>

<div id="toast" class="toast"></div>

<body class="page-teachers">

    <div id="toast" class="toast"></div>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <header class="top-header">
                <div>
                    <h1>Teachers</h1>
                    <p><span id="schoolName"></span></p>
                </div>
                <button type="button" class="btn-primary" id="openAddTeacher">
                    <i class="fa-solid fa-plus"></i> Add teacher
                </button>
            </header>

            <!-- SUMMARY TILES -->
            <section class="tm-stats" id="teacherStats" aria-label="Staff summary">
                <div class="tm-stat">
                    <span class="tm-stat-icon tm-tone-teal"><i class="fa-solid fa-users"></i></span>
                    <div><strong id="statTotal">0</strong><span>Total staff</span></div>
                </div>
                <div class="tm-stat">
                    <span class="tm-stat-icon tm-tone-indigo"><i class="fa-solid fa-user-shield"></i></span>
                    <div><strong id="statAdmins">0</strong><span>Admins</span></div>
                </div>
                <div class="tm-stat">
                    <span class="tm-stat-icon tm-tone-amber"><i class="fa-solid fa-chalkboard-user"></i></span>
                    <div><strong id="statTeachers">0</strong><span>Teachers</span></div>
                </div>
                <div class="tm-stat">
                    <span class="tm-stat-icon tm-tone-green"><i class="fa-solid fa-school"></i></span>
                    <div><strong id="statAssigned">0</strong><span>With a class</span></div>
                </div>
            </section>

            <!-- SEARCH + FILTER -->
            <div class="tm-toolbar">
                <label class="tm-search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" id="teacherSearch" placeholder="Search by name or username" autocomplete="off">
                </label>
                <div class="tm-filters" role="group" aria-label="Filter by role">
                    <button type="button" class="tm-chip is-active" data-filter="all">All</button>
                    <button type="button" class="tm-chip" data-filter="admin">Admins</button>
                    <button type="button" class="tm-chip" data-filter="teacher">Teachers</button>
                </div>
            </div>

            <!-- TEACHER CARDS (populated at runtime) -->
            <div class="tm-grid" id="teacherGridMount"></div>

            <div class="tm-empty" id="teacherEmpty" style="display:none;">
                <i class="fa-regular fa-face-frown-open"></i>
                <p>No staff match your search.</p>
            </div>

        </main>

    </div>

    <!-- ADD TEACHER MODAL -->
    <div class="confirm-modal" id="addTeacherModal">
        <div class="confirm-card" style="width:360px;">

            <div id="addTeacherForm">

                <div class="confirm-header">
                    <h2>Add a teacher</h2>
                </div>

                <div class="confirm-body">

                    <label for="teacherFullName" style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">Full name</label>
                    <input type="text" id="teacherFullName" placeholder="Chibuzor Okafor" required
                           style="width:100%; padding:8px 10px; border:1px solid var(--border); border-radius:8px; box-sizing:border-box;">

                    <p class="login-error" id="addTeacherError" style="display:none; margin-top:8px;"></p>

                </div>

                <div class="confirm-footer">
                    <button type="button" class="btn-secondary" id="cancelAddTeacher">Cancel</button>
                    <button type="button" class="btn-primary" id="submitAddTeacher">Add teacher</button>
                </div>

            </div>

            <div id="addTeacherResult" style="display:none;">

                <div class="confirm-header">
                    <h2>Teacher created</h2>
                </div>

                <div class="confirm-body">
                    <p id="addTeacherResultText"></p>

                    <div style="background:var(--surface-alt); border-radius:8px; padding:0.75rem 1rem; margin:0.75rem 0; display:flex; flex-direction:column; gap:8px;">
                        <div>
                            <span style="display:block; font-size:11px; color:var(--text-muted);">Username</span>
                            <code id="newTeacherUsername"></code>
                        </div>
                        <div>
                            <span style="display:block; font-size:11px; color:var(--text-muted);">Temporary password</span>
                            <code id="newTeacherPassword"></code>
                        </div>
                    </div>
                </div>

                <div class="confirm-footer">
                    <button type="button" class="btn-primary" id="closeAddTeacherResult">Done</button>
                </div>

            </div>

        </div>
    </div>

    <!-- RESET PASSWORD MODAL -->
    <div class="confirm-modal" id="resetPasswordModal">
        <div class="confirm-card" style="width:340px;">

            <div class="confirm-header">
                <h2>Password reset</h2>
            </div>

            <div class="confirm-body">
                <p id="resetPasswordText"></p>

                <div style="background:var(--surface-alt); border-radius:8px; padding:0.75rem 1rem; margin:0.75rem 0; display:flex; flex-direction:column; gap:8px;">
                    <div>
                        <span style="display:block; font-size:11px; color:var(--text-muted);">Username</span>
                        <code id="resetUsername"></code>
                    </div>
                    <div>
                        <span style="display:block; font-size:11px; color:var(--text-muted);">New temporary password</span>
                        <code id="resetPassword"></code>
                    </div>
                </div>
            </div>

            <div class="confirm-footer">
                <button type="button" class="btn-primary" id="closeResetPasswordModal">Done</button>
            </div>

        </div>
    </div>

    <!-- TEACHER DETAIL SHEET -->
    <div class="tm-sheet" id="teacherSheet" hidden>
        <div class="tm-sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheetName">

            <button type="button" class="tm-sheet-close" id="sheetClose" aria-label="Close">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="tm-sheet-head">
                <div class="tm-avatar tm-avatar-lg" id="sheetAvatar" aria-hidden="true"></div>
                <div class="tm-id">
                    <h2 class="tm-sheet-name" id="sheetName"></h2>
                    <span class="tm-role" id="sheetRole"></span>
                </div>
            </div>

            <div class="tm-sheet-user">
                <i class="fa-regular fa-user"></i>
                <code id="sheetUsername"></code>
                <button type="button" class="tm-copy" id="sheetCopy" aria-label="Copy username" title="Copy username">
                    <i class="fa-regular fa-copy"></i>
                </button>
            </div>

            <section class="tm-sheet-section">
                <h3><i class="fa-solid fa-school"></i> Class heading</h3>
                <div id="sheetHeading"></div>
            </section>

            <section class="tm-sheet-section">
                <h3><i class="fa-solid fa-book-open"></i> Subjects teaching</h3>
                <div id="sheetTeaching"></div>
            </section>

            <section class="tm-sheet-section">
                <h3><i class="fa-solid fa-sliders"></i> Manage</h3>
                <div class="tm-sheet-actions" id="sheetActions"></div>
                <p class="tm-sheet-note" id="sheetNote" style="display:none;"></p>
            </section>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="/assets/js/activity-log.js"></script>
    <script src="/assets/js/admin-teachers.js"></script>

</body>
</html>

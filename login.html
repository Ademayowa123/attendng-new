<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Login</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <style>

        /* Login button: icon + label for each state */
        #loginSubmit {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        #loginSubmit.is-loading:disabled {
            cursor: progress;
        }

        /* Solid, darker teal once login has worked (overrides the faded disabled look) */
        #loginSubmit.is-success:disabled {
            background: #0b5c56;
            opacity: 1;
            cursor: default;
        }


        /* "Login Successful - your dashboard is loading" message */
        .login-success-overlay {
            position: fixed;
            inset: 0;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 16px;
            background: rgba(0, 0, 0, 0.45);
            animation: loginFadeIn 0.2s ease-out;
        }

        .login-success-overlay[hidden] {
            display: none;
        }

        .login-success-card {
            width: 320px;
            max-width: 100%;
            padding: 1.75rem 1.5rem 1.5rem;
            background: #ffffff;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.18);
            animation: loginPop 0.25s ease-out;
        }

        .login-success-icon {
            width: 44px;
            height: 44px;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--success-bg, #eafaf1);
            color: #0f766e;
            font-size: 18px;
        }

        .login-success-card h2 {
            margin: 0 0 6px;
            font-size: 17px;
            color: #1f2937;
        }

        .login-success-card p {
            margin: 0;
            font-size: 13px;
            color: #6b7280;
        }

        .login-success-loader {
            height: 4px;
            margin-top: 18px;
            overflow: hidden;
            border-radius: 999px;
            background: #e5e7eb;
        }

        .login-success-loader span {
            display: block;
            width: 40%;
            height: 100%;
            border-radius: 999px;
            background: #0f766e;
            animation: loginSlide 1.1s ease-in-out infinite;
        }

        @keyframes loginFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        @keyframes loginPop {
            from { opacity: 0; transform: scale(0.94); }
            to { opacity: 1; transform: scale(1); }
        }

        @keyframes loginSlide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
        }

        @media (prefers-reduced-motion: reduce) {

            .login-success-overlay,
            .login-success-card,
            .login-success-loader span {
                animation: none;
            }

        }

    </style>

</head>
<body class="login-body">

    <div class="login-page">

        <form class="login-card" id="loginForm">

            <div class="login-brand">
                <img src="/assets/images/logo.png" alt="AttendNG" class="login-logo">
                <p>Log in to your school</p>
            </div>

            <label for="identifier">Email or username</label>
            <input type="text" id="identifier" autocomplete="username" required>

            <label for="password">Password</label>
            <div class="password-field">
                <input type="password" id="password" autocomplete="current-password" required>
                <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password" tabindex="-1">
                    <i class="fa-solid fa-eye"></i>
                </button>
            </div>

            <p class="login-error" id="loginError" style="display:none;"></p>

            <button type="submit" id="loginSubmit">Log in</button>

            <p class="login-hint">
                Logging in with a username? Ask your school admin to reset your password if needed.
            </p>

            <p class="login-hint">
                <a href="/platform/forgot-password.html">Forgot your superadmin password?</a>
            </p>

        </form>

    </div>

    <div class="login-success-overlay" id="loginSuccess" role="status" aria-live="polite" hidden>
        <div class="login-success-card">
            <div class="login-success-icon"><i class="fa-solid fa-check"></i></div>
            <h2>Login Successful</h2>
            <p>Welcome to AttendNG. Your dashboard is loading…</p>
            <div class="login-success-loader" aria-hidden="true"><span></span></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/login.js"></script>

</body>
</html>

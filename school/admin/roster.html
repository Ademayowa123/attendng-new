<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AttendNG | Roster</title>
    <link rel="icon" href="/assets/images/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/scss/sytle.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

</head>

<div id="toast" class="toast"></div>

<body>

    <div class="container">

        <aside class="sidebar" id="sidebarMount"></aside>

        <main class="main-content">

            <a href="/school/admin/classes.html" class="st-back">
                <i class="fa-solid fa-arrow-left" aria-hidden="true"></i> Classes
            </a>

            <header class="top-header st-header">

                <div class="st-title-row">
                    <span class="rs-tile" id="classTile"></span>
                    <div>
                        <h1 id="pageTitle">Roster</h1>
                        <p><span id="registerStatusBadge"></span></p>
                    </div>
                </div>

                <div class="st-head-actions">
                    <button type="button" class="st-btn" id="viewReportsBtn">
                        <i class="fa-solid fa-file-lines" aria-hidden="true"></i> Reports
                    </button>
                    <button type="button" class="st-btn" id="viewAnalyticsBtn">
                        <i class="fa-solid fa-chart-line" aria-hidden="true"></i> Analytics
                    </button>
                </div>

            </header>

            <section class="st-metrics">

                <div class="st-metric">
                    <span class="st-metric-label">Students</span>
                    <strong id="studentCount">0</strong>
                </div>

                <div class="st-metric">
                    <span class="st-metric-label">Gender</span>
                    <div class="st-split">
                        <span><i class="st-dot st-dot-male"></i>Male <b id="maleCount">0</b></span>
                        <span><i class="st-dot st-dot-female"></i>Female <b id="femaleCount">0</b></span>
                    </div>
                    <div class="st-bar" id="genderBar"></div>
                </div>

                <div class="st-metric">
                    <span class="st-metric-label">Missing details</span>
                    <strong id="missingCount">0</strong>
                    <span class="st-metric-note">no admission number</span>
                </div>

            </section>

            <section class="st-toolbar">

                <label class="rs-search">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input type="search" id="searchStudent" placeholder="Search students" autocomplete="off" aria-label="Search students">
                </label>

                <div class="rs-filters" role="group" aria-label="Filter by gender">
                    <button type="button" class="rs-filter is-active" data-gender="all" aria-pressed="true">All <span id="countAll">0</span></button>
                    <button type="button" class="rs-filter" data-gender="male" aria-pressed="false">Male <span id="countMale">0</span></button>
                    <button type="button" class="rs-filter" data-gender="female" aria-pressed="false">Female <span id="countFemale">0</span></button>
                </div>

                <span class="st-toolbar-spacer"></span>

                <div class="st-toolbar-buttons">

                    <div class="st-dropdown">
                        <button type="button" class="st-btn" id="importMenuBtn" aria-haspopup="true" aria-expanded="false">
                            <i class="fa-solid fa-file-import" aria-hidden="true"></i> Import <i class="fa-solid fa-chevron-down" aria-hidden="true" style="font-size:11px;"></i>
                        </button>
                        <div class="st-menu" id="importMenu" role="menu" hidden>
                            <button type="button" id="downloadTemplateBtn" role="menuitem">
                                <i class="fa-solid fa-file-arrow-down" aria-hidden="true"></i> Download template
                            </button>
                            <button type="button" id="importStudentsBtn" role="menuitem">
                                <i class="fa-solid fa-file-import" aria-hidden="true"></i> Import from Excel
                            </button>
                        </div>
                    </div>

                    <button type="button" class="st-btn st-btn-primary" id="addStudentBtn">
                        <i class="fa-solid fa-user-plus" aria-hidden="true"></i> Add student
                    </button>

                </div>

                <input type="file" id="studentImportFile" accept=".xlsx" hidden>

            </section>

            <section class="rs-list">

                <div class="st-list-head st-cols" aria-hidden="true">
                    <span>#</span>
                    <span>Student</span>
                    <span>Admission no.</span>
                    <span>Gender</span>
                    <span></span>
                </div>

                <div id="studentList"></div>

                <p class="rs-note" id="listNote" hidden></p>

                <div class="rs-list-foot">
                    <span id="showingCount"></span>
                </div>

            </section>

        </main>

    </div>

    <!-- ADD STUDENT MODAL -->
    <div class="modal" id="studentModal">
        <div class="modal-content">

            <div class="modal-header">
                <h2 id="studentModalTitle">Add Student</h2>
                <button type="button" id="closeModal">&times;</button>
            </div>

            <form id="studentForm">

                <div class="form-group">
                    <label>Surname</label>
                    <input type="text" id="surname" required>
                </div>

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstname" required>
                </div>

                <div class="form-group">
                    <label>Other Name</label>
                    <input type="text" id="othername">
                </div>

                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Admission No. (optional)</label>
                    <input type="text" id="admissionno">
                </div>

                <div class="form-group">
                    <label>Date of Birth (optional)</label>
                    <input type="date" id="dob">
                </div>

                <p class="login-error" id="studentFormError" style="display:none;"></p>

                <div class="modal-buttons">
                    <button type="button" id="cancelBtn" class="btn-light">Cancel</button>
                    <button type="submit" class="btn-primary">Save Student</button>
                </div>

            </form>

        </div>
    </div>

    <!-- IMPORT SUMMARY MODAL -->
    <div id="importSummaryModal" class="import-summary-modal">
        <div class="import-summary-card">

            <div class="import-summary-header">
                <div class="import-summary-icon"><i class="fa-solid fa-file-import"></i></div>
                <h2>Import Complete</h2>
                <button id="closeImportSummary" class="import-summary-close">&times;</button>
            </div>

            <div class="import-summary-body">

                <div class="import-summary-item success">
                    <i class="fa-solid fa-circle-check"></i>
                    <div><strong id="importedCount">0</strong><span>Students Imported</span></div>
                </div>

                <div class="import-summary-item warning">
                    <i class="fa-solid fa-copy"></i>
                    <div><strong id="duplicateCount">0</strong><span>Duplicate Students Skipped</span></div>
                </div>

                <div class="import-summary-item danger">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <div><strong id="invalidCount">0</strong><span>Invalid Rows Skipped</span></div>
                </div>

                <div class="import-summary-item neutral">
                    <i class="fa-solid fa-minus-circle"></i>
                    <div><strong id="emptyCount">0</strong><span>Empty Rows Ignored</span></div>
                </div>

            </div>

            <div class="import-summary-footer">
                <button id="closeImportSummaryBtn" class="btn-primary">Done</button>
            </div>

        </div>
    </div>

    <!-- DELETE STUDENT MODAL -->
    <div class="confirm-modal" id="deleteStudentModal">
        <div class="confirm-card" style="width:340px;">

            <div class="confirm-header">
                <h2>Remove student</h2>
            </div>

            <div class="confirm-body">

                <p id="deleteStudentMessage" style="margin:0;"></p>

                <p class="login-error" id="deleteStudentError" style="display:none; margin-top:8px;"></p>

            </div>

            <div class="confirm-footer">
                <button type="button" class="btn-info" id="cancelDeleteStudent">Cancel</button>
                <button type="button" class="btn-danger" id="confirmDeleteStudent">Delete</button>
            </div>

        </div>
    </div>

    <div class="st-menu" id="rowMenu" role="menu" hidden></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4"></script>
    <script src="/assets/js/supabase.js"></script>
    <script src="/assets/js/user-context.js"></script>
    <script src="/assets/js/auth.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/exceljs/dist/exceljs.min.js"></script>
    <script src="/assets/js/activity-log.js"></script>
    <script src="/assets/js/admin-roster.js"></script>

</body>
</html>
